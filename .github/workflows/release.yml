name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.1-mcp"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    # Preview tags are built locally and uploaded by hand (they carry unpushed package refs).
    if: ${{ !endsWith(github.ref_name, '-preview') }}
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out MCP package
        uses: actions/checkout@v4
        with:
          repository: dreamfactorysoftware/df-mcp-server
          ref: 92dfef8  # feat/mcp-exposure
          path: .build/df-mcp-server-source

      - name: Check out quickstart system package
        uses: actions/checkout@v4
        with:
          repository: dreamfactorysoftware/df-system
          ref: 0.6.5
          path: .build/df-system-source

      - name: Check out quickstart Admin UI package
        uses: actions/checkout@v4
        with:
          repository: dreamfactorysoftware/df-admin-interface
          ref: ded246c5  # feat/mcp-exposure
          path: .build/df-admin-interface-source

      - name: Check out system MCP daemon package
        uses: actions/checkout@v4
        with:
          repository: dreamfactorysoftware/df-system-mcp-server
          ref: 815f49b
          path: .build/df-system-mcp-server-source

      - name: Check out df-ai package
        uses: actions/checkout@v4
        with:
          repository: dreamfactorysoftware/df-ai
          ref: 0.1.0
          path: .build/df-ai-source

      - name: Check out df-ai-chat package
        uses: actions/checkout@v4
        with:
          repository: dreamfactorysoftware/df-ai-chat
          ref: 0.1.0
          path: .build/df-ai-chat-source

      - name: Build quickstart archive
        env:
          GITHUB_TOKEN: ${{ secrets.DF_BUILD_GITHUB_TOKEN || github.token }}
          BRANCH: "7.7.0"
          SYSTEM_MCP_PACKAGE_DIR: ${{ github.workspace }}/.build/df-system-mcp-server-source
          VERSION: ${{ steps.release.outputs.version }}
          INCLUDE_MCP: "true"
          MCP_PACKAGE_DIR: ${{ github.workspace }}/.build/df-mcp-server-source
          LOCAL_DF_SYSTEM_DIR: ${{ github.workspace }}/.build/df-system-source
          LOCAL_DF_ADMIN_INTERFACE_DIR: ${{ github.workspace }}/.build/df-admin-interface-source
          LOCAL_DF_AI_DIR: ${{ github.workspace }}/.build/df-ai-source
          LOCAL_DF_AI_CHAT_DIR: ${{ github.workspace }}/.build/df-ai-chat-source
        run: ./build-binary.sh

      - name: Smoke test archive
        run: ./smoke-binary.sh dist/dreamfactory-quickstart-linux-x86_64.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/dreamfactory-quickstart-linux-x86_64.tar.gz \
            dist/SHA256SUMS \
            install.sh \
            --title "DreamFactory Quickstart $TAG" \
            --notes-file .github/release-notes.md
